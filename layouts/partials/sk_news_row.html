{{/* One news item, used on the homepage and the news archive. */}}
<a class="sk-news-row" href="{{ .RelPermalink }}" data-reveal>
  <time datetime="{{ .Date.Format "2006-01-02" }}"><b>{{ .Date.Format "Jan 2" }}</b><span>{{ .Date.Format "2006" }}</span></time>
  <div class="sk-news-body">
    <h3>{{ .Title }}</h3>
    {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
  </div>
  <span class="sk-news-arrow" aria-hidden="true">→</span>
</a>
